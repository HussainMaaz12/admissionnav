<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admission Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Abstract Background Elements */
        body::before {
            content: '';
            position: absolute;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(26, 31, 77, 0) 70%);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, rgba(26, 31, 77, 0) 70%);
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #d4af37 0%, #f5d547 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1f4d;
            font-size: 24px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            margin: 0 auto 30px;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            z-index: -1;
            opacity: 0.5;
        }

        .header-text {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2em;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .header-text p {
            color: #a0a5c0;
            font-size: 0.95em;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.85em;
            color: #d4af37;
            margin-bottom: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .input-group input::placeholder {
            color: #666b7f;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37 0%, #e6c555 100%);
            color: #1a1f4d;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1.05em;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(212, 175, 55, 0.3);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-message {
            color: #ff6b6b;
            font-size: 0.85em;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85em;
            color: #666b7f;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }
            .header-text h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">NCR</div>
        <div class="header-text">
            <h1>Welcome Back</h1>
            <p>Sign in to access the Admission Navigator</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-login">Secure Login</button>
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="footer-text">
            &copy; 2024 Strategic Admissions Bureau
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-login');
            btn.innerHTML = 'Authenticating...';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            // Simulate network request delay
            setTimeout(() => {
                // For demonstration purposes, accepting any input and redirecting to the dashboard
                window.location.href = 'dashboard.html';
            }, 800);
        });
    </script>

</body>
</html>
